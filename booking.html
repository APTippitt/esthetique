<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book — esthetique Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#b8975a;--gold-d:#8a6e3a;--gold-p:#f0e4cc;--gold-a:#d4b07a;--bg:#f7f3ee;--sf:#faf7f3;--tx:#2d2620;--mu:#9c8f82;--bd:#e8e0d5;}
html,body{width:100%;min-height:100%;background:var(--bg);font-family:'Jost',sans-serif;color:var(--tx);}
.shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.hdr{background:linear-gradient(145deg,#f5e6c8,#e8cd96,#d4aa6a);padding:env(safe-area-inset-top,24px) 24px 20px;position:relative;overflow:hidden;}
.hdr::before{content:'';position:absolute;top:-60px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);border-radius:50%;}
.logo{font-family:'Playfair Display',Georgia,serif;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:rgba(74,44,8,.5);margin-bottom:4px;}
.hed{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:600;color:#4a2c08;letter-spacing:-.5px;margin-bottom:2px;}
.sub{font-family:'Cormorant Garamond',Georgia,serif;font-size:13px;font-style:italic;color:rgba(74,44,8,.6);margin-bottom:18px;}
.mt{display:flex;background:rgba(255,255,255,.35);border-radius:12px;padding:4px;}
.mb{flex:1;padding:9px 10px;border:none;background:transparent;border-radius:9px;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;color:rgba(74,44,8,.55);cursor:pointer;line-height:1.2;transition:all .2s;}
.mb.on{background:#fff;color:#4a2c08;box-shadow:0 1px 6px rgba(0,0,0,.1);}
.mb span{display:block;font-size:10px;font-weight:400;opacity:.7;margin-top:2px;}
.pg{display:flex;gap:5px;margin-top:16px;}
.pb{flex:1;height:3px;border-radius:2px;background:rgba(74,44,8,.15);transition:background .35s;}
.pb.on{background:rgba(74,44,8,.55);}
.body{flex:1;padding:22px 20px 40px;}
@keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.sh{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:600;color:var(--tx);margin-bottom:4px;}
.ss{font-family:'Cormorant Garamond',Georgia,serif;font-size:14px;font-style:italic;color:var(--mu);margin-bottom:20px;}
.sc{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1.5px solid var(--bd);border-radius:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .1s;}
.sc:hover,.sc.sel{border-color:var(--gold);transform:translateY(-1px);}
.sc.sel{background:#fffdf8;}
.si{width:44px;height:44px;border-radius:12px;background:var(--gold-p);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.sn{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:2px;}
.sm{font-size:11.5px;color:var(--mu);}
.sp{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:600;color:var(--tx);margin-left:auto;flex-shrink:0;}
.tc{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1.5px solid var(--bd);border-radius:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.tc:hover,.tc.sel{border-color:var(--gold);}
.av{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.tn{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:2px;}
.tr{font-family:'Cormorant Garamond',Georgia,serif;font-size:13px;font-style:italic;color:var(--mu);}
.sb{display:inline-block;font-size:10px;font-weight:600;color:var(--gold-d);background:var(--gold-p);border-radius:20px;padding:2px 9px;margin-top:3px;}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.tp{padding:11px 4px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;cursor:pointer;text-align:center;font-family:'Jost',sans-serif;font-size:13px;color:var(--tx);transition:all .15s;}
.tp:hover,.tp.sel{border-color:var(--gold);background:var(--gold-p);color:var(--gold-d);font-weight:600;}
.lb{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:7px;display:block;}
.fi{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;font-family:'Jost',sans-serif;font-size:14px;color:var(--tx);background:#fff;outline:none;transition:border-color .15s;margin-bottom:14px;display:block;}
.fi:focus{border-color:var(--gold);}
.fa{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;font-family:'Jost',sans-serif;font-size:14px;color:var(--tx);background:#fff;outline:none;resize:none;height:72px;transition:border-color .15s;margin-bottom:14px;display:block;}
.fa:focus{border-color:var(--gold);}
.cc{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px;}
.cs{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid #f0ebe3;margin-bottom:14px;}
.cr{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.cr:last-child{margin:0;}
.ci{font-size:14px;width:22px;flex-shrink:0;margin-top:2px;}
.cl{font-size:11px;color:var(--mu);margin-bottom:2px;}
.cv{font-size:13.5px;font-weight:500;color:var(--tx);}
.nb{font-size:12px;color:var(--mu);line-height:1.6;padding:12px 14px;background:var(--sf);border-radius:12px;border:1px solid #f0ebe3;margin-bottom:16px;}
.bg{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold-a));color:#fff;border:none;border-radius:13px;font-family:'Jost',sans-serif;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 3px 14px rgba(184,151,90,.35);transition:opacity .2s,transform .15s;margin-bottom:10px;}
.bg:hover{opacity:.92;}
.bg:active{transform:scale(.98);}
.bg:disabled{opacity:.4;cursor:default;box-shadow:none;}
.bw{background:linear-gradient(135deg,#6b5e52,#5a4e45);}
.gh{width:100%;padding:11px;background:none;border:1.5px solid var(--bd);border-radius:12px;font-family:'Jost',sans-serif;font-size:13px;color:var(--mu);cursor:pointer;transition:border-color .15s;}
.gh:hover{border-color:var(--gold);color:var(--gold-d);}
.wb{background:linear-gradient(135deg,#f5eee3,#ede4d8);border:1px solid #d4c4a8;border-radius:16px;padding:16px 18px;margin-bottom:20px;}
.wt{font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:600;color:#4a2c08;margin-bottom:6px;}
.wx{font-size:12.5px;color:#7a5e3a;line-height:1.65;}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:18px;}
.dp{padding:10px 2px;border-radius:10px;border:1.5px solid var(--bd);background:#fff;cursor:pointer;text-align:center;font-size:10.5px;font-weight:500;color:var(--mu);transition:all .15s;line-height:1.3;}
.dp:hover,.dp.sel{border-color:var(--gold);background:var(--gold-p);color:var(--gold-d);}
.ds{display:block;font-size:9px;opacity:.7;margin-bottom:1px;}
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.pc{padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;cursor:pointer;transition:all .15s;}
.pc:hover,.pc.sel{border-color:var(--gold);background:var(--gold-p);}
.pl{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:2px;}
.px{font-size:11px;color:var(--mu);}
.pc.sel .pl,.pc.sel .px{color:var(--gold-d);}
.wn{width:56px;height:56px;border-radius:50%;background:var(--gold-p);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:600;color:var(--gold-d);margin:0 auto 14px;}
.ok{text-align:center;padding:20px 0 40px;}
.bl{font-size:56px;margin-bottom:14px;}
.ot{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:600;color:var(--tx);margin-bottom:8px;}
.om{font-family:'Cormorant Garamond',Georgia,serif;font-size:15.5px;color:var(--mu);line-height:1.65;margin-bottom:24px;}
.on{color:var(--gold-d);font-style:italic;}
.ws{background:var(--gold-p);border-radius:14px;padding:14px 16px;margin-bottom:24px;text-align:left;}
.wst{font-size:12px;font-weight:600;color:var(--gold-d);margin-bottom:5px;}
.wsb{font-size:12.5px;color:var(--gold-d);line-height:1.65;}
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <div class="logo">esthetique Studio</div>
    <div class="hed" id="hS">Book Your Visit</div>
    <div class="sub" id="hT">Palmer, MI — Online Booking</div>
    <div class="mt">
      <button class="mb on" id="bkBtn" onclick="setMode('book')">Book Appointment<span>Choose a date &amp; time</span></button>
      <button class="mb" id="wlBtn" onclick="setMode('waitlist')">Join Waitlist<span>Get notified of openings</span></button>
    </div>
    <div class="pg" id="pg"></div>
  </div>
  <div class="body" id="bd"></div>
</div>
<script>
var ALL_SVC=[
  {id:'s1',name:'Hydrafacial',cat:'Facial',dur:'60 min',price:145,ico:'&#128167;',sp:['JT']},
  {id:'s2',name:'Custom Facial',cat:'Facial',dur:'75 min',price:120,ico:'&#10024;',sp:['JT','ML']},
  {id:'s3',name:'Signature Facial',cat:'Facial',dur:'60 min',price:130,ico:'&#127800;',sp:['ML']},
  {id:'s4',name:'Chemical Peel',cat:'Facial',dur:'60 min',price:110,ico:'&#127807;',sp:['JT']},
  {id:'s5',name:'Microdermabrasion',cat:'Facial',dur:'60 min',price:100,ico:'&#128142;',sp:['ML']},
  {id:'s6',name:'Lash Lift & Tint',cat:'Lash & Brow',dur:'45 min',price:95,ico:'&#128065;',sp:['CB']},
  {id:'s7',name:'Brow Lamination',cat:'Lash & Brow',dur:'45 min',price:75,ico:'&#127912;',sp:['CB']},
  {id:'s8',name:'Back Facial',cat:'Body',dur:'60 min',price:90,ico:'&#127802;',sp:['ML']},
];
var ALL_STF=[
  {id:'JT',name:'Jadyn Tippitt',role:'Lead Esthetician & Owner',color:'#b8975a',init:'JT'},
  {id:'ML',name:'Megan Lamb',role:'Esthetician & Owner',color:'#7a9e87',init:'ML'},
  {id:'CB',name:'Cassandra Bastian',role:'Esthetician',color:'#a898c8',init:'CB'},
];
var DEF_TIMES=['9:00 AM','9:30 AM','10:00 AM','10:30 AM','11:00 AM','11:30 AM','1:00 PM','1:30 PM','2:00 PM','2:30 PM','3:00 PM','3:30 PM','4:00 PM'];
var DAYS=[{l:'Monday',s:'Mon',k:'M'},{l:'Tuesday',s:'Tue',k:'T'},{l:'Wednesday',s:'Wed',k:'W'},{l:'Thursday',s:'Thu',k:'T'},{l:'Friday',s:'Fri',k:'F'},{l:'Saturday',s:'Sat',k:'Sa'},{l:'Sunday',s:'Sun',k:'Su'}];

// Load config from shared localStorage (written by the staff app)
var CFG={enabled:true,studioName:'esthetique Studio',tagline:'Palmer, MI — Online Booking',welcomeMsg:'Book Your Visit',cancellationNote:'24-hour cancellation policy applies.',timeSlots:DEF_TIMES,enabledServices:['s1','s2','s3','s4','s5','s6','s7','s8'],enabledStaff:['JT','ML','CB']};
try{var _c=localStorage.getItem('esth-public-config');if(_c){var _p=JSON.parse(_c);Object.assign(CFG,_p);}}catch(e){}
// Sync service prices from staff app
try{var _sv=localStorage.getItem('esth-services');if(_sv){JSON.parse(_sv).forEach(function(s){var m=ALL_SVC.find(function(x){return x.id===s.id;});if(m&&s.price){m.price=s.price;m.name=s.name;}});}}catch(e){}

var SVC=ALL_SVC.filter(function(s){return CFG.enabledServices.indexOf(s.id)>=0;});
var STF=ALL_STF.filter(function(m){return CFG.enabledStaff.indexOf(m.id)>=0;});
var TIMES=CFG.timeSlots&&CFG.timeSlots.length?CFG.timeSlots:DEF_TIMES;

var mode='book';
var B={step:0,svc:null,stf:null,date:'',time:null,name:'',phone:'',email:'',notes:''};
var W={step:0,svc:null,stf:null,pri:'asap',days:[],name:'',phone:'',email:'',notes:''};

function today(){return new Date().toISOString().split('T')[0];}
function fmtD(d){try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}catch(e){return d;}}

function setMode(m){
  mode=m;
  document.getElementById('bkBtn').className='mb'+(m==='book'?' on':'');
  document.getElementById('wlBtn').className='mb'+(m==='waitlist'?' on':'');
  B={step:0,svc:null,stf:null,date:'',time:null,name:'',phone:'',email:'',notes:''};
  W={step:0,svc:null,stf:null,pri:'asap',days:[],name:'',phone:'',email:'',notes:''};
  fade(render);
}

function setPg(tot,done){
  var p=document.getElementById('pg'),h='';
  for(var i=0;i<tot;i++) h+='<div class="pb'+(i<done?' on':'')+'"></div>';
  p.innerHTML=h;
}

function fade(fn){
  var b=document.getElementById('bd');
  b.style.cssText='opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s';
  setTimeout(function(){fn();b.style.cssText='opacity:1;transform:translateY(0);transition:opacity .22s,transform .22s';},180);
}

function ucats(list){var seen={},r=[];list.forEach(function(s){if(!seen[s.cat]){seen[s.cat]=1;r.push(s.cat);}});return r;}

function sCards(list,selId,fn){
  var h='';
  list.forEach(function(s){
    h+='<div class="sc'+(selId===s.id?' sel':'')+'" onclick="'+fn+'(\''+s.id+'\')">'+
      '<div class="si">'+s.ico+'</div>'+
      '<div style="flex:1"><div class="sn">'+s.name+'</div><div class="sm">'+s.dur+' &mdash; '+s.cat+'</div></div>'+
      '<div class="sp">$'+s.price+'</div></div>';
  });
  return h;
}

function stCards(selId,fn,svc){
  var h='<div class="tc'+(selId===null?' sel':'')+'" onclick="'+fn+'(null)">'+
    '<div class="av" style="background:var(--gold-p);color:var(--gold-d);font-size:18px">&#127922;</div>'+
    '<div><div class="tn">No preference</div><div class="tr">First available esthetician</div></div></div>';
  STF.forEach(function(m){
    var sp=svc&&svc.sp.indexOf(m.id)>=0;
    h+='<div class="tc'+(selId===m.id?' sel':'')+'" onclick="'+fn+'(\''+m.id+'\')">'+
      '<div class="av" style="background:'+m.color+'">'+m.init+'</div>'+
      '<div><div class="tn">'+m.name+'</div>'+
      (sp?'<div class="sb">Specializes in this</div>':'<div class="tr">'+m.role+'</div>')+
      '</div></div>';
  });
  return h;
}

// ── BOOKING ──────────────────────────────────────────────────────────────────
function renderBook(){
  setPg(5,B.step+1);
  var b=document.getElementById('bd'),h='';
  if(B.step===0){
    h='<div class="sh">What can we do for you?</div><div class="ss">Select a service to get started</div>';
    ucats(SVC).forEach(function(cat,ci){
      h+='<label class="lb" style="margin-top:'+(ci?'16px':'0')+'">'+cat+'</label>';
      h+=sCards(SVC.filter(function(s){return s.cat===cat;}),B.svc&&B.svc.id,'bSvc');
    });
  } else if(B.step===1){
    h='<div class="sh">Your esthetician</div><div class="ss">Or let us match you with first available</div>';
    h+=stCards(B.stf&&B.stf.id,'bStf',B.svc);
    h+='<div style="height:12px"></div><button class="gh" onclick="bBk()">&#8592; Back</button>';
  } else if(B.step===2){
    h='<div class="sh">Date &amp; time</div><div class="ss">Pick your preferred slot</div>'+
      '<label class="lb">Date</label>'+
      '<input type="date" class="fi" value="'+(B.date||today())+'" min="'+today()+'" oninput="B.date=this.value">'+
      '<label class="lb">Available times</label><div class="tg">';
    TIMES.forEach(function(t){h+='<div class="tp'+(B.time===t?' sel':'')+'" onclick="bTime(\''+t+'\')">'+t+'</div>';});
    h+='</div><button class="bg" id="tbtn" '+(B.time?'':'disabled')+' onclick="if(B.time)bNx()">Continue &#8594;</button>'+
      '<button class="gh" onclick="bBk()">&#8592; Back</button>';
  } else if(B.step===3){
    h='<div class="sh">Your information</div><div class="ss">We\'ll send your confirmation here</div>'+
      '<label class="lb">Full Name</label><input class="fi" placeholder="Jane Doe" value="'+B.name+'" oninput="B.name=this.value;chkB()">'+
      '<label class="lb">Phone</label><input class="fi" type="tel" placeholder="(555) 555-0100" value="'+B.phone+'" oninput="B.phone=this.value;chkB()">'+
      '<label class="lb">Email</label><input class="fi" type="email" placeholder="jane@email.com" value="'+B.email+'" oninput="B.email=this.value;chkB()">'+
      '<label class="lb">Notes (optional)</label><textarea class="fa" placeholder="Allergies, skin concerns..." oninput="B.notes=this.value">'+B.notes+'</textarea>'+
      '<button class="bg" id="ibtn" '+(B.name&&(B.phone||B.email)?'':'disabled')+' onclick="if(B.name&&(B.phone||B.email))bNx()">Review Booking &#8594;</button>'+
      '<button class="gh" onclick="bBk()">&#8592; Back</button>';
  } else if(B.step===4){
    h='<div class="sh">Confirm your booking</div><div style="height:10px"></div>'+
      '<div class="cc"><div class="cs">'+
        '<div style="width:42px;height:42px;border-radius:12px;background:var(--gold-p);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">'+B.svc.ico+'</div>'+
        '<div><div class="cv">'+B.svc.name+'</div><div class="cl">'+B.svc.dur+' &mdash; $'+B.svc.price+'</div></div></div>'+
        '<div class="cr"><div class="ci">&#128197;</div><div><div class="cl">Date &amp; Time</div><div class="cv">'+fmtD(B.date)+' at '+B.time+'</div></div></div>'+
        '<div class="cr"><div class="ci">&#9997;</div><div><div class="cl">Esthetician</div><div class="cv">'+(B.stf?B.stf.name:'First available')+'</div></div></div>'+
        '<div class="cr"><div class="ci">&#128100;</div><div><div class="cl">Name</div><div class="cv">'+B.name+'</div></div></div>'+
        '<div class="cr"><div class="ci">&#128222;</div><div><div class="cl">Contact</div><div class="cv">'+(B.phone||B.email)+'</div></div></div>'+
      '</div>'+
      '<div class="nb">'+CFG.cancellationNote+'</div>'+
      '<button class="bg" onclick="bSub()">Request Appointment &#10003;</button>'+
      '<button class="gh" onclick="bBk()">&#8592; Edit info</button>';
  } else {
    var fn=B.name.split(' ')[0]||'there';
    h='<div class="ok"><div class="bl">&#127800;</div>'+
      '<div class="ot">You\'re all set, <span class="on">'+fn+'</span>!</div>'+
      '<div class="om">Your request for <strong>'+B.svc.name+'</strong> on '+fmtD(B.date)+' at '+B.time+' has been sent. We\'ll confirm within 24 hours.</div>'+
      '<button class="bg" onclick="setMode(\'book\')">Book Another Appointment</button>'+
      '<div style="margin-top:14px;font-family:\'Cormorant Garamond\',Georgia,serif;font-size:14px;font-style:italic;color:var(--mu);text-align:center">We can\'t wait to see you &#10024;</div></div>';
  }
  b.innerHTML=h;
}

function bSvc(id){B.svc=SVC.find(function(s){return s.id===id;});B.step=1;fade(render);}
function bStf(id){B.stf=id?STF.find(function(m){return m.id===id;}):null;B.date=B.date||today();B.step=2;fade(render);}
function bTime(t){B.time=t;var btn=document.getElementById('tbtn');if(btn)btn.disabled=false;renderBook();}
function bNx(){B.step++;fade(render);}
function bBk(){B.step=Math.max(0,B.step-1);fade(render);}
function bSub(){B.step=5;fade(render);}
function chkB(){var b=document.getElementById('ibtn');if(b)b.disabled=!(B.name&&(B.phone||B.email));}

// ── WAITLIST ─────────────────────────────────────────────────────────────────
function renderWL(){
  setPg(4,W.step+1);
  var b=document.getElementById('bd'),h='';
  if(W.step===0){
    h='<div class="sh">Join the waitlist</div><div class="ss">Get notified when a spot opens</div>'+
      '<div class="wb"><div class="wt">&#128203; How it works</div><div class="wx">When an appointment is cancelled we reach out to everyone on the waitlist for that service. First to confirm gets the spot!</div></div>'+
      '<label class="lb">Which service?</label>';
    ucats(SVC).forEach(function(cat,ci){
      h+='<label class="lb" style="margin-top:'+(ci?'14px':'0')+'">'+cat+'</label>';
      h+=sCards(SVC.filter(function(s){return s.cat===cat;}),W.svc&&W.svc.id,'wSvc');
    });
  } else if(W.step===1){
    h='<div class="sh">Your availability</div><div class="ss">Helps us match you to the right opening</div>'+
      '<label class="lb">Which days work?</label><div class="dg">';
    DAYS.forEach(function(d){
      var sel=W.days.indexOf(d.l)>=0;
      h+='<div class="dp'+(sel?' sel':'')+'" onclick="wDay(\''+d.l+'\')"><span class="ds">'+d.k+'</span>'+d.s+'</div>';
    });
    h+='</div><label class="lb">Preferred esthetician</label>';
    h+=stCards(W.stf&&W.stf.id,'wStf',W.svc);
    h+='<label class="lb" style="margin-top:18px">How soon?</label><div class="pg2">';
    [['asap','ASAP','First available'],['week','This week','Next 7 days'],['month','This month','Next 30 days'],['flex','Flexible','No rush']].forEach(function(p){
      h+='<div class="pc'+(W.pri===p[0]?' sel':'')+'" onclick="wPri(\''+p[0]+'\')"><div class="pl">'+p[1]+'</div><div class="px">'+p[2]+'</div></div>';
    });
    h+='</div><button class="bg bw" onclick="wNx()">Continue &#8594;</button><button class="gh" onclick="wBk()">&#8592; Back</button>';
  } else if(W.step===2){
    h='<div class="sh">Contact info</div><div class="ss">We\'ll reach out the moment a spot opens</div>'+
      '<label class="lb">Full Name</label><input class="fi" placeholder="Jane Doe" value="'+W.name+'" oninput="W.name=this.value;chkW()">'+
      '<label class="lb">Phone (recommended)</label><input class="fi" type="tel" placeholder="(555) 555-0100" value="'+W.phone+'" oninput="W.phone=this.value;chkW()">'+
      '<label class="lb">Email</label><input class="fi" type="email" placeholder="jane@email.com" value="'+W.email+'" oninput="W.email=this.value;chkW()">'+
      '<label class="lb">Anything we should know?</label><textarea class="fa" placeholder="Preferred time of day, concerns..." oninput="W.notes=this.value">'+W.notes+'</textarea>'+
      '<div class="nb">&#128241; We\'ll text or email when an opening matches your preferences. First to confirm gets the spot!</div>'+
      '<button class="bg bw" id="wibtn" '+(W.name&&(W.phone||W.email)?'':'disabled')+' onclick="if(W.name&&(W.phone||W.email))wNx()">Review &amp; Join &#8594;</button>'+
      '<button class="gh" onclick="wBk()">&#8592; Back</button>';
  } else if(W.step===3){
    var ds=W.days.length?W.days.map(function(d){return d.substring(0,3);}).join(', '):'Any day';
    var ps={asap:'ASAP',week:'This week',month:'This month',flex:'Flexible'};
    h='<div class="sh">Review your request</div><div style="height:10px"></div>'+
      '<div class="cc"><div class="cs">'+
        '<div style="width:42px;height:42px;border-radius:12px;background:var(--gold-p);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">'+W.svc.ico+'</div>'+
        '<div><div class="cv">'+W.svc.name+'</div><div class="cl">'+W.svc.dur+' &mdash; $'+W.svc.price+'</div></div></div>'+
        '<div class="cr"><div class="ci">&#128197;</div><div><div class="cl">Available days</div><div class="cv">'+ds+'</div></div></div>'+
        '<div class="cr"><div class="ci">&#9997;</div><div><div class="cl">Preference</div><div class="cv">'+(W.stf?W.stf.name:'Any esthetician')+'</div></div></div>'+
        '<div class="cr"><div class="ci">&#9889;</div><div><div class="cl">Priority</div><div class="cv">'+ps[W.pri]+'</div></div></div>'+
        '<div class="cr"><div class="ci">&#128100;</div><div><div class="cl">Name</div><div class="cv">'+W.name+'</div></div></div>'+
        '<div class="cr"><div class="ci">&#128222;</div><div><div class="cl">Contact</div><div class="cv">'+(W.phone||W.email)+'</div></div></div>'+
      '</div>'+
      '<div class="nb">When a cancellation matches your preferences we\'ll contact you right away. Reply any time to update or remove your spot.</div>'+
      '<button class="bg bw" onclick="wSub()">Join Waitlist &#10003;</button><button class="gh" onclick="wBk()">&#8592; Edit</button>';
  } else {
    var wf=W.name.split(' ')[0]||'there';
    var wn=Math.floor(Math.random()*3)+2;
    h='<div class="ok"><div class="wn">'+wn+'</div>'+
      '<div class="ot">You\'re on the list, <span class="on">'+wf+'</span>!</div>'+
      '<div class="om">You\'re #'+wn+' for <strong>'+W.svc.name+'</strong>. The moment a spot opens we\'ll contact '+(W.phone||W.email)+'. First to confirm gets it!</div>'+
      '<div class="ws"><div class="wst">&#128203; Your details</div><div class="wsb">'+W.svc.name+' &mdash; $'+W.svc.price+'<br>'+ds+' &mdash; '+(W.stf?W.stf.name:'Any esthetician')+'</div></div>'+
      '<button class="bg" onclick="setMode(\'book\')">Book a Specific Time Instead</button>'+
      '<button class="gh" style="margin-top:10px" onclick="setMode(\'waitlist\')">Join for Another Service</button></div>';
  }
  b.innerHTML=h;
}

function wSvc(id){W.svc=SVC.find(function(s){return s.id===id;});W.step=1;fade(render);}
function wStf(id){W.stf=id?STF.find(function(m){return m.id===id;}):null;renderWL();}
function wPri(p){W.pri=p;renderWL();}
function wDay(d){var i=W.days.indexOf(d);if(i>=0)W.days.splice(i,1);else W.days.push(d);renderWL();}
function wNx(){W.step++;fade(render);}
function wBk(){W.step=Math.max(0,W.step-1);fade(render);}
function wSub(){W.step=4;fade(render);}
function chkW(){var b=document.getElementById('wibtn');if(b)b.disabled=!(W.name&&(W.phone||W.email));}

function render(){if(mode==='book')renderBook();else renderWL();}

// Init
var hS=document.getElementById('hS');
var hT=document.getElementById('hT');
if(hS)hS.textContent=CFG.welcomeMsg||'Book Your Visit';
if(hT)hT.textContent=CFG.tagline||'Palmer, MI';

if(!CFG.enabled){
  var od=document.getElementById('bd');
  od.style.cssText='text-align:center;padding:48px 24px';
  od.innerHTML='<div style="font-size:52px;margin-bottom:16px">&#128274;</div>'+
    '<div style="font-size:20px;font-weight:600;color:#2d2620;margin-bottom:10px">Online booking is currently unavailable</div>'+
    '<div style="font-size:15px;color:#9c8f82;line-height:1.65">Please call or text us to schedule. We look forward to seeing you!</div>';
  document.getElementById('pg').style.display='none';
  document.querySelector('.mt').style.display='none';
} else {
  render();
}
</script>
</body>
</html>
